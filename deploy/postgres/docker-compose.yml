services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-yashfaa}
      POSTGRES_USER: ${POSTGRES_USER:-yashfaa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      # Host port 5433 (not 5432 — this VPS already runs another Postgres
      # natively on 5432). Exposed on all interfaces so the app can reach
      # it; lock this down with the firewall (ufw/iptables) and keep
      # POSTGRES_PASSWORD strong — this port is public.
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-yashfaa}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
