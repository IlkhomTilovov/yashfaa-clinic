services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-yashfaa}
      POSTGRES_USER: ${POSTGRES_USER:-yashfaa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      # Bind to all interfaces so Cloudflare Hyperdrive can reach it.
      # Lock this down with a firewall (ufw/iptables) to Cloudflare's IP
      # ranges, and keep POSTGRES_PASSWORD strong — this port is public.
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-yashfaa}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
