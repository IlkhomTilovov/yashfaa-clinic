name: Deploy Postgres (VPS) + migrate

on:
  push:
    branches: [main]
    paths:
      - "deploy/postgres/**"
      - "drizzle/**"
      - "src/lib/db/schema.ts"
      - ".github/workflows/deploy-db.yml"
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 1. Bring up (or update) the Postgres container on the VPS.
      - name: Deploy docker-compose to VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            command -v docker >/dev/null || (curl -fsSL https://get.docker.com | sh)
            mkdir -p /opt/yashfaa/postgres

      - name: Copy docker-compose.yml to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "deploy/postgres/docker-compose.yml"
          target: "/opt/yashfaa/postgres"
          strip_components: 2

      - name: Start Postgres
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /opt/yashfaa/postgres
            cat > .env <<EOF
            POSTGRES_DB=yashfaa
            POSTGRES_USER=yashfaa
            POSTGRES_PASSWORD=${{ secrets.DB_PASSWORD }}
            EOF
            docker compose up -d
            for i in $(seq 1 30); do
              docker compose ps --format json | grep -q '"Health":"healthy"' && break
              sleep 2
            done
            docker compose ps

      # 2. Apply new Drizzle migrations from this runner, over the network,
      # against the VPS Postgres's public port (kept up to date by step 1).
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Run migrations
        env:
          DATABASE_URL: postgres://yashfaa:${{ secrets.DB_PASSWORD }}@${{ secrets.VPS_HOST }}:5433/yashfaa
        run: bun run db:migrate
